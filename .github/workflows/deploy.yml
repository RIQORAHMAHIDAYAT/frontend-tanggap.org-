name: Deploy Frontend to Hostinger FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://tanggap.org

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install

      - name: 🏗️ Build project
        run: bun run build

      - name: 🚀 Upload to cPanel Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false

      - name: ✅ Smoke check live site
        run: |
          curl -fsSL https://tanggap.org/robots.txt | grep -q "Sitemap:" \
            && echo "OK: robots.txt live" \
            || (echo "FAIL: deploy salah docroot" && exit 1)
